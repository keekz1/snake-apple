<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
    /* CSS */
.control-btn {
    position: absolute;
    width: 50px; /* Adjust width as needed */
    height: 50px; /* Adjust height as needed */
    background-color: #ccc;
    border: none;
    border-radius: 50%;
    opacity: 0.7;
    cursor: pointer;
    z-index: 2; /* Ensure buttons overlay each other */
}

#leftBtn {
    left: 400px; /* Adjust positioning as needed */
    bottom:40px; /* Adjust positioning as needed */
}

#upBtn {
    left: 450px;
    bottom: 74px;
}

#rightBtn {
    right:400px; /* Adjust positioning as needed */
    bottom:40px; 
    / /* Adjust positioning as needed */
}

#downBtn {
    left: calc(50% - 25px); /* Adjust positioning as needed */
    bottom: 20px; /* Adjust positioning as needed */
}

</style>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
        <div class="message"></div>
        <button id="tryAgainBtn">Try Again</button>
    </div>
    <div class="controls">
        <button class="control-btn" id="leftBtn">Left</button>
        <button class="control-btn" id="upBtn">Up</button>
        <button class="control-btn" id="rightBtn">Right</button>
        <button class="control-btn" id="downBtn">Down</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
